name: ledger_flutter_plus
description: A Flutter plugin to scan, connect & sign transactions using your Ledger Nano devices
version: 2.0.0
homepage: https://developers.ledger.com/
repository: https://github.com/vespr-wallet/ledger-flutter-plus
issue_tracker: https://github.com/vespr-wallet/ledger-flutter-plus/issues

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  universal_ble: ^3.3.0
  universal_platform: ^1.1.0
  ledger_usb_plus: ^1.0.8
  rxdart: ^0.28.0
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# flutter:

# This package supports all platforms listed below.
platforms:
  android:
  ios:
  web:
